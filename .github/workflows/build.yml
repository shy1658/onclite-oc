name: build-onclite-oc

on:
  workflow_dispatch:
    inputs:
      level:
        description: "safe = 2.016 GHz + GPU 725 | high = 2.208 GHz + GPU 800 | max = 2.208 GHz @1.10V + GPU 825"
        required: true
        default: max
        type: choice
        options:
          - max
          - high
          - safe
          - mild
          - extreme
          - extreme-v
      boot_url:
        description: "optional: direct URL to a stock boot.img (or ROM zip). When set, the run also produces a repacked boot .img"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout patcher
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex libssl-dev libelf-dev \
            zip unzip python3 device-tree-compiler \
            binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone LineageOS 21 kernel
        run: |
          git clone --depth 1 --single-branch \
            -b lineage-21 \
            https://github.com/LineageOS/android_kernel_xiaomi_onclite.git kernel

      - name: Apply overclock patches
        run: python3 apply_oc.py kernel --level "${{ inputs.level }}"

      - name: Fetch proton-clang
        run: git clone --depth 1 https://github.com/kdrag0n/proton-clang.git tc

      - name: Build Image.gz-dtb
        run: |
          export PATH="$PWD/tc/bin:$PATH"
          # The in-tree dtc predates "-@" (CONFIG_BUILD_ARM64_DT_OVERLAY exports
          # DTC_FLAGS := -@), so use the distro dtc instead.
          dtc --version
          make -C kernel O=out ARCH=arm64 \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            DTC_EXT=/usr/bin/dtc \
            onclite-perf_defconfig
          make -C kernel O=out ARCH=arm64 \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            DTC_EXT=/usr/bin/dtc \
            -j"$(nproc)" Image.gz-dtb

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git ak3
          cp anykernel.sh ak3/anykernel.sh
          cp kernel/out/arch/arm64/boot/Image.gz-dtb ak3/Image.gz-dtb
          ( cd ak3 && zip -r9 "../onclite-oc-${{ inputs.level }}.zip" . -x ".git/*" "README.md" "*.zip" )
          ls -lh "onclite-oc-${{ inputs.level }}.zip"

      - name: Fetch stock boot image
        if: inputs.boot_url != ''
        run: |
          curl -fL --retry 3 -o boot-source "${{ inputs.boot_url }}"
          ls -lh boot-source

      - name: Repack boot image with the OC kernel
        if: inputs.boot_url != ''
        run: |
          python3 repack_boot.py \
            boot-source \
            kernel/out/arch/arm64/boot/Image.gz-dtb \
            "boot-onclite-oc-${{ inputs.level }}.img"
          ls -lh "boot-onclite-oc-${{ inputs.level }}.img"

      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: onclite-oc-${{ inputs.level }}-zip
          path: onclite-oc-${{ inputs.level }}.zip
          if-no-files-found: error

      - name: Upload boot image
        if: inputs.boot_url != ''
        uses: actions/upload-artifact@v4
        with:
          name: boot-onclite-oc-${{ inputs.level }}
          path: boot-onclite-oc-${{ inputs.level }}.img
          if-no-files-found: error

      - name: Upload raw kernel
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-dtb-${{ inputs.level }}
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
          if-no-files-found: error
